<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PyBot AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-logo">🤖</div>

            <div>
                <div class="brand-name">PyBot</div>
                <div class="brand-ai">AI ASSISTANT</div>
            </div>
        </div>

        <div class="side-line"></div>

        <div class="side-title">
            AI MODES
        </div>

        <button class="side-mode active" data-mode="General">
            <span>◉</span>
            General
        </button>

        <button class="side-mode" data-mode="Study">
            <span>◆</span>
            Study
        </button>

        <button class="side-mode" data-mode="Coding">
            <span>⌘</span>
            Coding
        </button>

        <button class="side-mode" data-mode="Creative">
            <span>✦</span>
            Creative
        </button>

        <div class="sidebar-bottom">

            <div class="system-status">
                <span class="status-dot"></span>
                <div>
                    <b>System Online</b>
                    <small>PyBot AI Engine</small>
                </div>
            </div>

            <div class="version">
                PYBOT AI • v1.0
            </div>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- HEADER -->

        <header class="topbar">

            <div class="mobile-brand">
                <div class="brand-logo small">🤖</div>

                <div>
                    <div class="brand-name">PyBot AI</div>
                    <div class="brand-ai">INTELLIGENT ASSISTANT</div>
                </div>
            </div>

            <div class="header-right">

                <div class="online">
                    <span></span>
                    ONLINE
                </div>

                <button id="clearBtn" class="clear-btn">
                    🗑 Clear
                </button>

            </div>

        </header>


        <!-- CHAT -->

        <section id="chat" class="chat">

            <!-- WELCOME -->

            <div id="welcome" class="welcome">

                <div class="welcome-orb">
                    🤖
                </div>

                <div class="welcome-title">
                    Welcome to <span>PyBot AI</span>
                </div>

                <div class="welcome-text">
                    Your intelligent assistant for
                    <b>study, coding, creativity</b>
                    and everyday questions.
                </div>

                <div class="quick-actions">

                    <button data-prompt="What is Python?">
                        <span>🐍</span>
                        Learn Python
                    </button>

                    <button data-prompt="Explain photosynthesis simply">
                        <span>📚</span>
                        Study Help
                    </button>

                    <button data-prompt="Write a Python program">
                        <span>💻</span>
                        Write Code
                    </button>

                    <button data-prompt="Give me a creative project idea">
                        <span>💡</span>
                        Get Ideas
                    </button>

                </div>

            </div>

        </section>


        <!-- CONTROLS -->

        <div class="controls">

            <div class="control-left">

                <div class="mode-label">
                    MODE
                </div>

                <select id="modeSelect">

                    <option value="General">
                        General
                    </option>

                    <option value="Study">
                        Study
                    </option>

                    <option value="Coding">
                        Coding
                    </option>

                    <option value="Creative">
                        Creative
                    </option>

                </select>


                <label class="search-toggle">

                    <input type="checkbox"
                           id="webSearch">

                    <span class="toggle"></span>

                    <span class="search-text">
                        🌐 Web Search
                    </span>

                </label>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="4000"
                    placeholder="Ask PyBot anything..."
                ></textarea>

                <button id="sendBtn"
                        class="send-btn">

                    <span>➤</span>

                </button>

            </div>

            <div class="input-hint">
                Press <b>Enter</b> to send •
                <b>Shift + Enter</b> for new line
            </div>

        </div>

    </main>

</div>


<script>

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const modeSelect = document.getElementById("modeSelect");
const webSearch = document.getElementById("webSearch");
const clearBtn = document.getElementById("clearBtn");
const welcome = document.getElementById("welcome");

let history = [];


// ================================================
// ADD MESSAGE
// ================================================

function addMessage(text, type) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const row = document.createElement("div");
    row.className = "message-row " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    avatar.textContent =
        type === "user" ? "👤" : "🤖";


    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;


    row.appendChild(avatar);
    row.appendChild(bubble);

    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;

    return bubble;
}


// ================================================
// TYPING
// ================================================

function showTyping() {

    const row = document.createElement("div");

    row.className = "message-row bot";
    row.id = "typingRow";

    const avatar = document.createElement("div");

    avatar.className = "avatar";
    avatar.textContent = "🤖";


    const bubble = document.createElement("div");

    bubble.className = "bubble typing";

    bubble.innerHTML =
        "<i></i><i></i><i></i>";


    row.appendChild(avatar);
    row.appendChild(bubble);

    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;
}


// ================================================
// SEND
// ================================================

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";
    input.style.height = "auto";

    sendBtn.disabled = true;

    showTyping();


    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                message: text,

                mode: modeSelect.value,

                web_search: webSearch.checked,

                history: history.slice(-6)

            })

        });


        const data = await response.json();


        const typing = document.getElementById("typingRow");

        if (typing) {
            typing.remove();
        }


        if (!response.ok) {

            addMessage(
                "❌ " + (data.error || "Something went wrong."),
                "bot"
            );

            sendBtn.disabled = false;

            return;
        }


        const reply =
            data.reply ||
            data.output ||
            data.message ||
            "No response received.";


        addMessage(reply, "bot");


        history.push({
            role: "user",
            content: text
        });


        history.push({
            role: "assistant",
            content: reply
        });


    } catch (error) {

        const typing = document.getElementById("typingRow");

        if (typing) {
            typing.remove();
        }

        addMessage(
            "❌ PyBot could not connect to the AI service.",
            "bot"
        );
    }


    sendBtn.disabled = false;

    input.focus();
}


// ================================================
// SEND BUTTON
// ================================================

sendBtn.addEventListener(
    "click",
    sendMessage
);


// ================================================
// ENTER
// ================================================

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


// ================================================
// AUTO TEXTAREA HEIGHT
// ================================================

input.addEventListener(
    "input",
    function() {

        this.style.height = "auto";

        this.style.height =
            Math.min(this.scrollHeight, 150) + "px";

    }
);


// ================================================
// CLEAR CHAT
// ================================================

clearBtn.addEventListener(
    "click",
    function() {

        history = [];

        chat.innerHTML = "";

        chat.appendChild(welcome);

        welcome.style.display = "flex";

    }
);


// ================================================
// QUICK ACTIONS
// ================================================

document.querySelectorAll(
    "[data-prompt]"
).forEach(button => {

    button.addEventListener(
        "click",
        function() {

            input.value =
                this.dataset.prompt;

            input.focus();

        }
    );

});


// ================================================
// SIDEBAR MODES
// ================================================

document.querySelectorAll(
    ".side-mode"
).forEach(button => {

    button.addEventListener(
        "click",
        function() {

            document.querySelectorAll(
                ".side-mode"
            ).forEach(btn => {
                btn.classList.remove("active");
            });


            this.classList.add("active");


            modeSelect.value =
                this.dataset.mode;

        }
    );

});


// ================================================
// MODE SELECT SYNC
// ================================================

modeSelect.addEventListener(
    "change",
    function() {

        document.querySelectorAll(
            ".side-mode"
        ).forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.mode === this.value
            );

        });

    }
);

</script>

</body>
</html>
